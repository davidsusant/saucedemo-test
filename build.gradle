plugins {
    id 'java'
}

group = 'com.saucedemo'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Cucumber
    testImplementation 'io.cucumber:cucumber-java:7.15.0'
    testImplementation 'io.cucumber:cucumber-testng:7.15.0'

    // Selenium
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.18.1'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.7.0'

    // TestNG
    testImplementation 'org.testng:testng:7.9.0'

    // Allure
    testImplementation 'io.qameta.allure:allure-cucumber7-jvm:2.26.0'
    testImplementation 'io.qameta.allure:allure-testng:2.26.0'
    testImplementation 'org.aspectj:aspectjweaver:1.9.21'

    // Logging
    testImplementation 'org.slf4j:slf4j-api:2.0.12'
    testImplementation 'ch.qos.logback:logback-classic:1.5.3'

    // Assertions
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

sourceSets {
    test {
        java { srcDirs = ['src/test/java'] }
        resources { srcDirs = ['src/test/resources'] }
    }
}

test {
    useTestNG() {
        suites 'src/test/resources/testng.xml'
        useDefaultListeners = true
    }

    scanForTestClasses = false

    jvmArgs "-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('aspectjweaver') }}"

    systemProperty 'allure.results.directory', 'build/allure-results'
    systemProperty 'browser', System.getProperty('browser', 'chrome')
    systemProperty 'headless', System.getProperty('headless', 'false')
    systemProperty 'base.url', System.getProperty('base.url', 'https://www.saucedemo.com')
    systemProperty 'implicit.wait', System.getProperty('implicit.wait', '10')
    systemProperty 'explicit.wait', System.getProperty('explicit.wait', '15')

    testLogging {
        events 'passed', 'skipped', 'failed', 'started'
        showStandardStreams = true
        showExceptions = true
        showStackTraces = true
    }
}
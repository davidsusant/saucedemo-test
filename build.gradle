plugins {
    id 'java'
    id 'io.qameta.allure' version '2.12.0'
}

group = 'com.saucedemo'
version = '1.0.0'

repositories {
    mavenCentral()
}

configurations {
    aspectjweaver
}

configurations.all {
    resolutionStrategy {
        force 'org.aspectj:aspectjweaver:1.9.21'
        force 'org.aspectj:aspectjrt:1.9.21'
        force 'org.aspectj:aspectjtools:1.9.21'
    }
}

dependencies {
    // Cucumber
    testImplementation 'io.cucumber:cucumber-java:7.15.0'
    testImplementation 'io.cucumber:cucumber-testng:7.15.0'
    testImplementation 'io.cucumber:cucumber-picocontainer:7.15.0'

    // Selenium
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.18.1'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.7.0'

    // TestNG
    testImplementation 'org.testng:testng:7.9.0'

    // Allure
    testImplementation 'io.qameta.allure:allure-cucumber7-jvm:2.26.0'
    testImplementation 'io.qameta.allure:allure-testng:2.26.0'

    // Logging
    testImplementation 'org.slf4j:slf4j-api:2.0.12'
    testImplementation 'ch.qos.logback:logback-classic:1.5.3'

    // Assertions
    testImplementation 'org.assertj:assertj-core:3.25.3'

    // AspectJ
    testImplementation 'org.aspectj:aspectjweaver:1.9.21'
    aspectjweaver 'org.aspectj:aspectjweaver:1.9.21'
}

sourceSets {
    test {
        java { srcDirs = ['src/test/java'] }
        resources { srcDirs = ['src/test/resources'] }
    }
}

allure {
    report {
        version.set('2.26.0')
    }
}

task cleanAllureResults(type: Delete) {
    delete "${projectDir}/allure-results"
}

test {
    dependsOn cleanAllureResults

    jvmArgs "-javaagent:${configurations.aspectjweaver.asPath}"

    useTestNG() {
        suites 'src/test/resources/testng.xml'
        useDefaultListeners = true
    }

    scanForTestClasses = false

    systemProperties = [
        'browser': System.getProperty('browser', 'chrome'),
        'headless': System.getProperty('headless', 'false'),
        'base.url': System.getProperty('base.url', 'https://www.saucedemo.com'),
        'implicit.wait': System.getProperty('implicit.wait', '10'),
        'explicit.wait': System.getProperty('explicit.wait', '15'),
        'cucumber.filter.tags': System.getProperty('cucumber.filter.tags', 'not @ignore')
    ]

    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}